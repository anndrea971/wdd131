<!DOCTYPE html>
<html lang="en">
<head>
    </head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <div class="section">
                <label for="product">Product Name<span class="required">*</span></label>
                <select name="product" id="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>
            
            <fieldset class="section" id="rating">
                <legend>Overall Rating<span class="required">*</span></legend>
                <div class="stars">
                    <label for="onestar">&star;<input type="radio" name="rating" id="onestar" value="1" required></label>
                    <label for="twostar">&star;&star;<input type="radio" name="rating" id="twostar" value="2" required></label>
                    <label for="threestar">&star;&star;&star;<input type="radio" name="rating" id="threestar" value="3" required></label>
                    <label for="fourstar">&star;&star;&star;&star;<input type="radio" name="rating" id="fourstar" value="4" required></label>
                    <label for="fivestar">&star;&star;&star;&star;&star;<input type="radio" name="rating" id="fivestar" value="5" required></label>
                </div>
            </fieldset>
            
            <div class="section">
                <label for="date">Date of Installation<span class="required">*</span></label>
                <input type="date" name="date" id="date" required>
            </div>
            
            <fieldset class="section">
                <legend>Which feature did you find useful in the product? <br>(Check all that apply)</legend>
                <label for="durability"><input type="checkbox" name="durability" id="durability" value="durability">Durability</label>
                <label for="ease"><input type="checkbox" name="ease" id="ease" value="ease">Ease of Use</label>
                <label for="performance"><input type="checkbox" name="performance" id="performance" value="performance">Performance</label>
                <label for="design"><input type="checkbox" name="design" id="design" value="design">Design</label>
            </fieldset>

            <div class="section">
                <label for="review">Written Review (Optional)</label>
                <textarea name="review" id="review"></textarea>
            </div>

            <div class="section">
                <label for="name">Your Name (Optional)</label>
                <input type="text" name="name" id="name">
            </div>

            <input type="submit" value="Post Review" class="submit">
        </form>
    </main>
    <footer>
        </footer>
</body>
</html>
